  <!-- Critical CSS -->
  <style>
    :root {
      --color-primary: #0cffdb;
      --color-primary-dark: #00c2a8;
      --color-secondary: #ff00e4;
      --color-accent: #7149fe;
      --color-background: #0f1021;
      --color-background-alt: #1a1e3a;
      --color-card-bg: #181c38;
      --color-text: #f2f5f7;
      --color-text-light: #a0aec0;
      --color-border: #2f3651;
      --color-code: #01d293;
      --max-width: 1200px;
      --border-radius: 4px;
      --section-padding: 4rem 0;
      --portfolio-padding: 6rem 0;
      --header-height: 60px;
      --transition: all 0.3s ease;
      --shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.4);
      --glow: 0 0 5px var(--color-primary), 0 0 20px rgba(12, 255, 219, 0.2);
      --neon-text-shadow: 0 0 5px rgba(12, 255, 219, 0.6)
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none
    }

    body {
      font-family: 'Space Mono', monospace;
      color: var(--color-text);
      background-color: var(--color-background);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background-color: rgba(15, 16, 33, 0.95);
      backdrop-filter: blur(5px);
      border-bottom: 1px solid var(--color-border);
      height: var(--header-height)
    }

    main {
      flex: 1 0 auto;
      padding-top: var(--header-height);
      display: flex;
      flex-direction: column
    }
  </style>

  <!-- Google Fonts with display=swap for better performance -->
  <link

  <link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
